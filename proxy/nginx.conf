worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # upstream 单独拆出去放一个文件：发布工具切流量就是重写这个小文件再 reload。
    # 让工具去改整个 nginx.conf 容易改坏，改一个只有几行的文件稳妥得多
    include /etc/nginx/upstream.d/*.conf;

    server {
        listen 80;

        location / {
            proxy_pass http://target_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
