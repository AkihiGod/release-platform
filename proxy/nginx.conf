worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # 客户端只认 nginx 这一个入口，后面的靶子服务换了几版它都不用管
    upstream target_app {
        # 这一行就是"当前在跑的版本"，发布和回滚都是改它然后 reload
        server app:5000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://target_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
