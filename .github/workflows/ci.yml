name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: 单元测试
        run: python -m pytest -q

  build-image:
    # 光测 Python 逻辑不够，Dockerfile 也得真能构建出来
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建靶子服务镜像
        run: docker build -t app:ci target-app
