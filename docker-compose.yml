# 固定项目名，这样网络名 release-platform_rp-net 是确定的，
# 发布工具后面用 docker run 起新容器时才能挂到同一个网络上
name: release-platform

services:
  app:
    build: ./target-app
    image: app:v1.0.0
    environment:
      APP_NAME: target-app
      APP_VERSION: v1.0.0
    networks:
      - rp-net

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      # 挂目录不挂单个文件：单个文件的绑定挂载在改文件后不一定能同步进容器
      - ./proxy/upstream.d:/etc/nginx/upstream.d:ro
    depends_on:
      - app
    networks:
      - rp-net

networks:
  rp-net:
